# Builds the SmartTank Android app (APK) in the cloud — no Android Studio needed.
#
# How to use:
#   1. Push this project to a GitHub repository.
#   2. Settings > Secrets and variables > Actions > New repository secret, add:
#        VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_DATABASE_URL,
#        VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_APP_ID
#      (optional) VITE_FUNCTIONS_REGION  — defaults to us-central1
#   3. Actions tab > "Build Android APK" > Run workflow (or just push to main).
#   4. When it finishes, open the run and download "SmartTank-apk" under Artifacts.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "functions/src/logic.js", ".github/workflows/android-apk.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FUNCTIONS_REGION: ${{ secrets.VITE_FUNCTIONS_REGION || 'us-central1' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check Firebase settings
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ] || [ -z "$VITE_FIREBASE_DATABASE_URL" ]; then
            echo "::error::Add the VITE_FIREBASE_* repository secrets first (see the top of this file)."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Build the web app
        run: npm run build

      - name: Create the Android project
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: App icon and splash screen
        continue-on-error: true   # falls back to the default icon if this step fails
        run: |
          npm run android:icons
          npx cap sync android

      - name: Allow notifications (Android 13+)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$MANIFEST" || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$MANIFEST"

      - name: Build APK
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SmartTank-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmartTank-apk
          path: web/SmartTank-debug.apk
          retention-days: 30
